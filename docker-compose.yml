services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sigra
      POSTGRES_USER: sigra
      POSTGRES_PASSWORD: sigra
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
      gunicorn sigra.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cambiar-antes-de-produccion}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://sigra:sigra@db:5432/sigra
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  postgres_data:
